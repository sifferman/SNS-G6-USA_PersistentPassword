name: Build, verify, and release patch

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_verify_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the base ROM from secrets
        id: base_rom
        env:
          BASE_ROM_SLICE_00: ${{ secrets.BASE_ROM_SLICE_00 }}
          BASE_ROM_SLICE_01: ${{ secrets.BASE_ROM_SLICE_01 }}
          BASE_ROM_SLICE_02: ${{ secrets.BASE_ROM_SLICE_02 }}
          BASE_ROM_SLICE_03: ${{ secrets.BASE_ROM_SLICE_03 }}
          BASE_ROM_SLICE_04: ${{ secrets.BASE_ROM_SLICE_04 }}
          BASE_ROM_SLICE_05: ${{ secrets.BASE_ROM_SLICE_05 }}
          BASE_ROM_SLICE_06: ${{ secrets.BASE_ROM_SLICE_06 }}
          BASE_ROM_SLICE_07: ${{ secrets.BASE_ROM_SLICE_07 }}
          BASE_ROM_SLICE_08: ${{ secrets.BASE_ROM_SLICE_08 }}
          BASE_ROM_SLICE_09: ${{ secrets.BASE_ROM_SLICE_09 }}
          BASE_ROM_SLICE_10: ${{ secrets.BASE_ROM_SLICE_10 }}
          BASE_ROM_SLICE_11: ${{ secrets.BASE_ROM_SLICE_11 }}
        run: |
          if [ -z "$BASE_ROM_SLICE_00" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Base ROM secrets are unavailable, so verification is skipped." \
                 "This is expected on a fork."
            exit 0
          fi
          python3 python/assemble_rom_from_secrets.py
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Restore build tools and emulator core
        if: steps.base_rom.outputs.available == 'true'
        id: restore_tools
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-${{ runner.os }}-asar-v1.91-flips-v198-bsnes-mercury-accuracy

      - name: Install build tools
        if: steps.base_rom.outputs.available == 'true' && steps.restore_tools.outputs.cache-hit != 'true'
        run: python3 python/download_build_tools.py tools/

      - name: Build the patch
        if: steps.base_rom.outputs.available == 'true'
        run: python3 python/build_patch.py tools/ build/base_rom_from_secrets.sfc

      - name: Verify the patch in an emulator
        if: steps.base_rom.outputs.available == 'true'
        run: python3 python/verify_patch_in_emulator.py tools/ build/base_rom_from_secrets.sfc

      - name: Tag the release
        if: >-
          steps.base_rom.outputs.available == 'true'
          && github.ref == 'refs/heads/main'
          && github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="$(date +%Y.%m.%d.%H.%M)"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Publish the release
        if: >-
          steps.base_rom.outputs.available == 'true'
          && github.ref == 'refs/heads/main'
          && github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          tag: ${{ env.TAG_NAME }}
          artifacts: "release/*.bps"
          token: ${{ secrets.GITHUB_TOKEN }}
